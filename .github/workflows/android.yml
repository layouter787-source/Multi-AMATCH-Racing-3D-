name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "polestar_racing/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-android:
    name: Export Android debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    env:
      GODOT_VERSION: "4.3"
      PROJECT_PATH: "polestar_racing"
      EXPORT_NAME: "Multi-AMATCH-Racing-3D"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          fi
          if [ -d /root/.config/godot ]; then
            mkdir -p ~/.config/godot
            cp -a /root/.config/godot/. ~/.config/godot/
          fi
          test -f "$PROJECT_PATH/project.godot" || { echo "ERRO: falta $PROJECT_PATH/project.godot. Adiciona primeiro a pasta polestar_racing do pacote-fonte."; exit 1; }
          test -f "$PROJECT_PATH/export_presets.cfg" || { echo "ERRO: falta $PROJECT_PATH/export_presets.cfg."; exit 1; }
          godot --version

      - name: Import Godot resources
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$GITHUB_WORKSPACE/$PROJECT_PATH" --editor --import --quit

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/android"
          godot --headless --verbose --path "$GITHUB_WORKSPACE/$PROJECT_PATH" \
            --export-debug "Android" "$GITHUB_WORKSPACE/build/android/${EXPORT_NAME}-debug.apk"
          test -s "$GITHUB_WORKSPACE/build/android/${EXPORT_NAME}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Multi-AMATCH-Racing-3D-Android-debug
          path: build/android/${{ env.EXPORT_NAME }}-debug.apk
          if-no-files-found: error
          retention-days: 14
