name: Android APK and AAB

on:
  push:
    branches: [main]
    paths:
      - "polestar_racing/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-android:
    name: Export Android packages (Godot 4.7.2)
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    env:
      GODOT_VERSION: "4.7.2"
      PROJECT_PATH: "polestar_racing"
      EXPORT_NAME: "Multi-AMATCH-Racing-3D"
      GODOT_ANDROID_KEYSTORE_RELEASE_PATH: "/tmp/multi-amatch-release.jks"
      GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
      GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Install CI system dependencies
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl unzip fontconfig
            rm -rf /var/lib/apt/lists/*
          fi

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install exact Godot 4.7.2 export templates
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          TEMPLATE_ARCHIVE="$RUNNER_TEMP/godot-4.7.2-templates.tpz"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -fL --retry 3 --retry-delay 2 "$TEMPLATE_URL" -o "$TEMPLATE_ARCHIVE"
          unzip -q "$TEMPLATE_ARCHIVE" -d "$RUNNER_TEMP/godot-template-unpack"
          if [ -d "$RUNNER_TEMP/godot-template-unpack/templates" ]; then
            cp -a "$RUNNER_TEMP/godot-template-unpack/templates/." "$TEMPLATE_DIR/"
          else
            cp -a "$RUNNER_TEMP/godot-template-unpack/." "$TEMPLATE_DIR/"
          fi
          test -f "$TEMPLATE_DIR/android_debug.apk" || {
            echo "ERRO: android_debug.apk não encontrado nos templates oficiais."
            find "$RUNNER_TEMP/godot-template-unpack" -maxdepth 3 -type f | head -80
            exit 1
          }
          test -f "$TEMPLATE_DIR/android_release.apk"
          GODOT_ACTUAL="$(godot --version)"
          echo "Godot instalado: $GODOT_ACTUAL"
          case "$GODOT_ACTUAL" in
            4.7.2.stable*) ;;
            *) echo "ERRO: esperava Godot 4.7.2 stable."; exit 1 ;;
          esac
          echo "Templates Android 4.7.2 instalados e verificados."

      - name: Validate project and Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_PATH/project.godot"
          test -f "$PROJECT_PATH/export_presets.cfg"
          java -version
          test -n "${ANDROID_HOME:-}" || test -n "${ANDROID_SDK_ROOT:-}" || {
            echo "ERRO: Android SDK não configurado na imagem CI."
            exit 1
          }

      - name: Restore and validate release keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$GODOT_ANDROID_KEYSTORE_RELEASE_USER"
          test -n "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          chmod 600 "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          keytool -list -keystore "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$GODOT_ANDROID_KEYSTORE_RELEASE_USER" >/dev/null
          echo "Keystore restaurada e validada."

      - name: Configure Android SDK and Java paths for Godot
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            for candidate in /opt/android-sdk /usr/lib/android-sdk "$HOME/Android/Sdk"; do
              if [ -d "$candidate" ]; then SDK_ROOT="$candidate"; break; fi
            done
          fi
          test -n "$SDK_ROOT" && test -d "$SDK_ROOT" || {
            echo "ERRO: não foi possível localizar o Android SDK."
            env | grep -E 'ANDROID|JAVA_HOME' || true
            find /opt /usr/lib /root -maxdepth 5 -type f -name sdkmanager 2>/dev/null | head -20 || true
            exit 1
          }
          JAVA_BIN="$(command -v java)"
          JAVA_ROOT="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$JAVA_BIN")")")}"
          test -x "$JAVA_ROOT/bin/java"
          echo "Android SDK: $SDK_ROOT"
          echo "Java SDK: $JAVA_ROOT"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_ROOT"
          EOF
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -d "$SDK_ROOT/platform-tools"
          test -d "$SDK_ROOT/build-tools"
          echo "SDK e Java configurados para o Godot."

      - name: Import Godot resources
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$GITHUB_WORKSPACE/$PROJECT_PATH" --editor --import --quit

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/android"
          godot --headless --verbose --path "$GITHUB_WORKSPACE/$PROJECT_PATH" \
            --export-debug "Android" "$GITHUB_WORKSPACE/build/android/${EXPORT_NAME}-debug.apk"
          test -s "$GITHUB_WORKSPACE/build/android/${EXPORT_NAME}-debug.apk"

      - name: Export signed release APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --verbose --path "$GITHUB_WORKSPACE/$PROJECT_PATH" \
            --export-release "Android" "$GITHUB_WORKSPACE/build/android/${EXPORT_NAME}-release.apk"
          test -s "$GITHUB_WORKSPACE/build/android/${EXPORT_NAME}-release.apk"

      - name: Export signed Android App Bundle
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --verbose --path "$GITHUB_WORKSPACE/$PROJECT_PATH" \
            --install-android-build-template \
            --export-release "Android AAB" "$GITHUB_WORKSPACE/build/android/${EXPORT_NAME}.aab"
          test -s "$GITHUB_WORKSPACE/build/android/${EXPORT_NAME}.aab"

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          for apk in "$GITHUB_WORKSPACE"/build/android/*-release.apk; do
            apksigner verify --verbose "$apk"
          done

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Multi-AMATCH-Racing-3D-Android-Godot-4.7.2
          path: |
            build/android/${{ env.EXPORT_NAME }}-debug.apk
            build/android/${{ env.EXPORT_NAME }}-release.apk
            build/android/${{ env.EXPORT_NAME }}.aab
          if-no-files-found: error
          retention-days: 14
